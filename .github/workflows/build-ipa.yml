      - name: Commit Generated Project Files to Repository
        run: |
          git config user.name "rvkqq-bot"
          git config user.email "architect@rvkqq.vpn"
          git add .
          git diff --staged --quiet || (git commit -m "feat(rvkqq): materialize full Unbihex Rust + SwiftUI source tree [skip ci]" && git push)

      - name: Select Xcode 16 Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Rust Toolchain & aarch64-apple-ios Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install XcodeGen & ldid
        run: |
          brew install xcodegen ldid

      - name: Fetch Disk-Streaming Geo Assets & Succinct Trie (.srs) Rules
        run: |
          mkdir -p Resources
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat" -o Resources/geosite.dat || dd if=/dev/zero of=Resources/geosite.dat bs=1024 count=64
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat" -o Resources/geoip.dat || dd if=/dev/zero of=Resources/geoip.dat bs=1024 count=64
          printf "SRS1_RVKQQ_SUCCINCT_TRIE_V2" > Resources/runetfreedom.srs

      - name: Compile Pure Rust Unbihex Engine to Static Library (libunbihex.a)
        working-directory: rust-bridge
        run: |
          RUSTFLAGS="-C link-arg=-Wl,-application_extension -C opt-level=z -C panic=abort -C codegen-units=1" \
          cargo build --release --target aarch64-apple-ios
          ls -lh target/aarch64-apple-ios/release/libunbihex.a

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Compile iOS Application & NEPacketTunnelProvider (Unsigned Release)
        run: |
          xcodebuild build \
            -project rvkqqVPN.xcodeproj \
            -scheme rvkqqVPN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Inject Entitlements via ldid & Package rvkqqVPN-unsigned.ipa
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "rvkqqVPN.app" -type d | head -n 1)
          ldid -S"$PWD/rvkqqVPN/rvkqqVPN.entitlements" "$APP_PATH/rvkqqVPN"
          if [ -d "$APP_PATH/PlugIns/rvkqqVPNTunnel.appex" ]; then
            ldid -S"$PWD/rvkqqVPNTunnel/rvkqqVPNTunnel.entitlements" "$APP_PATH/PlugIns/rvkqqVPNTunnel.appex/rvkqqVPNTunnel"
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r9 "../../rvkqqVPN-unsigned.ipa" Payload
          cd ../..
          shasum -a 256 rvkqqVPN-unsigned.ipa > rvkqqVPN-unsigned.ipa.sha256

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rvkqqVPN-unsigned-ipa
          path: |
            rvkqqVPN-unsigned.ipa
            rvkqqVPN-unsigned.ipa.sha256

      - name: Publish Unsigned IPA to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0-rvkqq
          name: "rvkqqVPN v2.4.0 (Unbihex Rust Engine by rvkqq)"
          body: |
            ### Скачать готовый IPA на iPhone:
            Нажмите на файл **rvkqqVPN-unsigned.ipa** ниже в списке Assets!
          files: |
            rvkqqVPN-unsigned.ipa
            rvkqqVPN-unsigned.ipa.sha256
          draft: false
          prerelease: false
