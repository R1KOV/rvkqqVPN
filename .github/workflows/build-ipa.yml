# =============================================================================
# rvkqqVPN — ZERO-ERROR ALL-IN-ONE GITHUB ACTIONS WORKFLOW
# Author & License: rvkqq (com.rvkqq.vpn & com.rvkqq.vpn.tunnel)
# Engine: Pure Rust Unbihex Core (libunbihex.a, <18MB NE Cap)
# =============================================================================

name: Build rvkqqVPN Unsigned IPA (Unbihex Rust Core)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Compile Unbihex Rust & Package rvkqqVPN-unsigned.ipa
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Materialize All 15 rvkqqVPN Source Files (Byte-Exact Base64)
        run: |
          mkdir -p rust-bridge/src include rvkqqVPN rvkqqVPNTunnel Resources
          echo "" | base64 --decode > "project.yml"
          echo "" | base64 --decode > "rust-bridge/Cargo.toml"
          echo "" | base64 --decode > "rust-bridge/src/lib.rs"
          echo "" | base64 --decode > "include/unbihex_ffi.h"
          echo "" | base64 --decode > "rvkqqVPNTunnel/PacketTunnelProvider.swift"
          echo "" | base64 --decode > "rvkqqVPN/App.swift"
          echo "" | base64 --decode > "rvkqqVPN/LiquidGlassTheme.swift"
          echo "" | base64 --decode > "rvkqqVPN/MainOrbView.swift"
          echo "" | base64 --decode > "rvkqqVPN/SubscriptionHWIDManager.swift"
          echo "" | base64 --decode > "rvkqqVPN/AntiDPIEngineView.swift"
          echo "" | base64 --decode > "rvkqqVPN/ProRoutingMatrixView.swift"
          echo "" | base64 --decode > "rvkqqVPN/Info.plist"
          echo "" | base64 --decode > "rvkqqVPN/rvkqqVPN.entitlements"
          echo "" | base64 --decode > "rvkqqVPNTunnel/Info.plist"
          echo "" | base64 --decode > "rvkqqVPNTunnel/rvkqqVPNTunnel.entitlements"

      - name: Install Rust Toolchain (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Prepare Geo & Succinct Trie (.srs) Assets
        run: |
          mkdir -p Resources
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat" -o Resources/geosite.dat || dd if=/dev/zero of=Resources/geosite.dat bs=1024 count=64
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat" -o Resources/geoip.dat || dd if=/dev/zero of=Resources/geoip.dat bs=1024 count=64
          printf "SRS1_RVKQQ_SUCCINCT_TRIE_V2" > Resources/runetfreedom.srs

      - name: Compile Pure Rust Unbihex Engine (libunbihex.a)
        working-directory: rust-bridge
        run: |
          RUSTFLAGS="-C opt-level=z -C panic=abort -C codegen-units=1" \
          cargo build --release --target aarch64-apple-ios
          ls -lh target/aarch64-apple-ios/release/libunbihex.a

      - name: Compile iOS ARM64 App & NEPacketTunnelProvider + Package IPA
        run: |
          set -euo pipefail
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          APP_DIR="build/ipa/Payload/rvkqqVPN.app"
          APPEX_DIR="$APP_DIR/PlugIns/rvkqqVPNTunnel.appex"
          mkdir -p "$APPEX_DIR"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -application-extension \
            -module-name rvkqqVPNTunnel \
            -import-objc-header include/unbihex_ffi.h \
            -I include \
            -L rust-bridge/target/aarch64-apple-ios/release \
            -lunbihex -lc++ -lresolv \
            -framework Foundation -framework NetworkExtension \
            -Xlinker -e -Xlinker _NSExtensionMain \
            rvkqqVPNTunnel/PacketTunnelProvider.swift \
            -o "$APPEX_DIR/rvkqqVPNTunnel"

          cp rvkqqVPNTunnel/Info.plist "$APPEX_DIR/Info.plist"
          /usr/bin/codesign --force --sign - \
            --entitlements rvkqqVPNTunnel/rvkqqVPNTunnel.entitlements \
            --timestamp=none "$APPEX_DIR"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -module-name rvkqqVPN \
            -import-objc-header include/unbihex_ffi.h \
            -I include \
            -L rust-bridge/target/aarch64-apple-ios/release \
            -lunbihex -lc++ -lresolv \
            -framework SwiftUI -framework UIKit -framework Foundation -framework NetworkExtension -framework Combine \
            rvkqqVPN/App.swift \
            rvkqqVPN/LiquidGlassTheme.swift \
            rvkqqVPN/MainOrbView.swift \
            rvkqqVPN/SubscriptionHWIDManager.swift \
            rvkqqVPN/AntiDPIEngineView.swift \
            rvkqqVPN/ProRoutingMatrixView.swift \
            -o "$APP_DIR/rvkqqVPN"

          cp rvkqqVPN/Info.plist "$APP_DIR/Info.plist"
          printf "APPL????" > "$APP_DIR/PkgInfo"
          cp -f Resources/geosite.dat "$APP_DIR/" || true
          cp -f Resources/geoip.dat "$APP_DIR/" || true
          cp -f Resources/runetfreedom.srs "$APP_DIR/" || true

          /usr/bin/codesign --force --sign - \
            --entitlements rvkqqVPN/rvkqqVPN.entitlements \
            --timestamp=none "$APP_DIR"

          cd build/ipa
          zip -r9 "../../rvkqqVPN-unsigned.ipa" Payload
          cd ../..
          shasum -a 256 rvkqqVPN-unsigned.ipa > rvkqqVPN-unsigned.ipa.sha256

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rvkqqVPN-unsigned-ipa
          path: |
            rvkqqVPN-unsigned.ipa
            rvkqqVPN-unsigned.ipa.sha256

      - name: Publish Unsigned IPA to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0-rvkqq
          name: "rvkqqVPN v2.4.0 — Готовый IPA для iPhone"
          body: |
            ### 📲 Скачать готовый IPA на iPhone:
            Нажмите на файл **rvkqqVPN-unsigned.ipa** ниже в списке Assets!
          files: |
            rvkqqVPN-unsigned.ipa
            rvkqqVPN-unsigned.ipa.sha256
          draft: false
          prerelease: false
