# =============================================================================
# rvkqqVPN — Zero-Touch Unsigned .ipa Builder (GitHub Actions)
# Author & License: rvkqq
# Compiles Unbihex Rust Core (aarch64-apple-ios) -> libunbihex.a, generates
# Xcode project via XcodeGen, builds with CODE_SIGNING_ALLOWED=NO, packages
# Payload into rvkqqVPN-unsigned.ipa, and publishes to Artifacts & Releases.
# =============================================================================

name: Build rvkqqVPN Unsigned IPA (Unbihex Rust Core)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag name (e.g. v2.4.0-rvkqq)"
        required: false
        default: "v2.4.0-rvkqq"

permissions:
  contents: write

env:
  APP_NAME: "rvkqqVPN"
  BUNDLE_ID: "com.rvkqq.vpn"
  TUNNEL_BUNDLE_ID: "com.rvkqq.vpn.tunnel"
  AUTHOR: "rvkqq"
  RUST_BACKTRACE: 1
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build-unsigned-ipa:
    name: Compile Unbihex (aarch64-apple-ios) & Package Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout rvkqqVPN Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Rust Toolchain & aarch64-apple-ios Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust Cargo Registry & Target Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-bridge/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('rust-bridge/Cargo.toml') }}

      - name: Install XcodeGen & ldid (Entitlements Fake-Signer for TrollStore/AltStore/Sideloadly)
        run: |
          brew install xcodegen ldid

      - name: Fetch Disk-Streaming Geo Assets & Succinct Trie (.srs) Rules
        run: |
          mkdir -p Resources
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat" -o Resources/geosite.dat || dd if=/dev/zero of=Resources/geosite.dat bs=1024 count=64
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat" -o Resources/geoip.dat || dd if=/dev/zero of=Resources/geoip.dat bs=1024 count=64
          printf "SRS1_RVKQQ_SUCCINCT_TRIE_V2" > Resources/runetfreedom.srs

      - name: Compile Pure Rust Unbihex Engine to Static Library (libunbihex.a)
        working-directory: rust-bridge
        run: |
          RUSTFLAGS="-C link-arg=-Wl,-application_extension -C opt-level=z -C panic=abort -C codegen-units=1" \
          cargo build --release --target aarch64-apple-ios
          ls -lh target/aarch64-apple-ios/release/libunbihex.a

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Compile iOS Application & NEPacketTunnelProvider (Unsigned Release)
        run: |
          xcodebuild build \
            -project rvkqqVPN.xcodeproj \
            -scheme rvkqqVPN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Inject App Group & NetworkExtension Entitlements via ldid & Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "rvkqqVPN.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: rvkqqVPN.app not found in DerivedData"
            exit 1
          fi

          # Preserve NetworkExtension & App Group entitlements for Sideloadly / ESign / Feather / TrollStore
          ldid -S"$PWD/rvkqqVPN/rvkqqVPN.entitlements" "$APP_PATH/rvkqqVPN"
          if [ -d "$APP_PATH/PlugIns/rvkqqVPNTunnel.appex" ]; then
            ldid -S"$PWD/rvkqqVPNTunnel/rvkqqVPNTunnel.entitlements" "$APP_PATH/PlugIns/rvkqqVPNTunnel.appex/rvkqqVPNTunnel"
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r9 "../../rvkqqVPN-unsigned.ipa" Payload
          cd ../..
          shasum -a 256 rvkqqVPN-unsigned.ipa > rvkqqVPN-unsigned.ipa.sha256
          ls -lh rvkqqVPN-unsigned.ipa rvkqqVPN-unsigned.ipa.sha256

      - name: Upload rvkqqVPN-unsigned.ipa to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rvkqqVPN-unsigned-ipa
          path: |
            rvkqqVPN-unsigned.ipa
            rvkqqVPN-unsigned.ipa.sha256
            rust-bridge/target/aarch64-apple-ios/release/libunbihex.a
          retention-days: 90

      - name: Publish Unsigned IPA to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0-rvkqq
          name: "rvkqqVPN v2.4.0 (Unbihex Rust Engine by rvkqq)"
          body: |
            ### rvkqqVPN — Production iOS Build by rvkqq
            - **Скачать готовый IPA на iPhone**: нажмите на `rvkqqVPN-unsigned.ipa` ниже в блоке Assets.
            - **Author & Architect**: `rvkqq`
            - **Bundle Identifiers**: `com.rvkqq.vpn` (Host) & `com.rvkqq.vpn.tunnel` (NEPacketTunnelProvider)
            - **Engine**: Pure Rust Unbihex static library (`libunbihex.a`, `aarch64-apple-ios`)
            - **Memory Ceiling**: Strict `<18.0 MB` NEPacketTunnelProvider footprint
          files: |
            rvkqqVPN-unsigned.ipa
            rvkqqVPN-unsigned.ipa.sha256
          draft: false
          prerelease: false
