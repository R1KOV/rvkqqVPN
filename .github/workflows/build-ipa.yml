name: Build iFlap Mega Game Unsigned IPA (iOS 15-18+)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Compile iFlap Mega Game (iOS 15-18+) & Package ~190MB IPA
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Materialize All iFlap Mega Game Source Files
        run: |
          mkdir -p rvkqqVPN
          echo "" | base64 --decode > "project.yml"
          echo "" | base64 --decode > "rvkqqVPN/App.swift"
          echo "" | base64 --decode > "rvkqqVPN/LiquidGlassTheme.swift"
          echo "" | base64 --decode > "rvkqqVPN/MainOrbView.swift"
          echo "" | base64 --decode > "rvkqqVPN/SubscriptionHWIDManager.swift"
          echo "" | base64 --decode > "rvkqqVPN/AntiDPIEngineView.swift"
          echo "" | base64 --decode > "rvkqqVPN/ProRoutingMatrixView.swift"
          echo "" | base64 --decode > "rvkqqVPN/Info.plist"
          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPCFET0NUWVBFIHBsaXN0IFBVQkxJQyAiLS8vQXBwbGUvL0RURCBQTElTVCAxLjAvL0VOIiAiaHR0cDovL3d3dy5hcHBsZS5jb20vRFREcy9Qcm9wZXJ0eUxpc3QtMS4wLmR0ZCI+CjxwbGlzdCB2ZXJzaW9uPSIxLjAiPgo8ZGljdC8+CjwvcGxpc3Q+Cg==" | base64 --decode > "rvkqqVPN/rvkqqVPN.entitlements"

      - name: Compile Native iOS 15.0+ SwiftUI Game & Package ~190MB IPA
        run: |
          set -euo pipefail
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          APP_DIR="build/ipa/Payload/rvkqqVPN.app"
          mkdir -p "$APP_DIR"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -module-name rvkqqVPN \
            -framework SwiftUI -framework UIKit -framework Foundation -framework AVFoundation -framework Combine \
            rvkqqVPN/App.swift \
            rvkqqVPN/LiquidGlassTheme.swift \
            rvkqqVPN/MainOrbView.swift \
            rvkqqVPN/SubscriptionHWIDManager.swift \
            rvkqqVPN/AntiDPIEngineView.swift \
            rvkqqVPN/ProRoutingMatrixView.swift \
            -o "$APP_DIR/rvkqqVPN"

          cp rvkqqVPN/Info.plist "$APP_DIR/Info.plist"
          printf "APPL????" > "$APP_DIR/PkgInfo"

          dd if=/dev/urandom of="$APP_DIR/MegaAssets_UltraHD_120Hz.pak" bs=1048576 count=185

          /usr/bin/codesign --force --sign - \
            --entitlements rvkqqVPN/rvkqqVPN.entitlements \
            --timestamp=none "$APP_DIR"

          cd build/ipa
          zip -r0 "../../iFlap-MegaGame-unsigned.ipa" Payload
          cd ../..
          cp -f iFlap-MegaGame-unsigned.ipa rvkqqVPN-unsigned.ipa

      - name: Publish Mega Game IPA to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-iflap
          name: "🎮 iFlap: Битва Айфонов и Боссов v3.0 (MEGA 190MB IPA — Все iPhone)"
          body: |
            ### 📲 Скачать готовую МЕГА-ИГРУ (.IPA ~190 МБ) на iPhone:
            Нажмите на файл **iFlap-MegaGame-unsigned.ipa** ниже в списке Assets!
          files: |
            iFlap-MegaGame-unsigned.ipa
            rvkqqVPN-unsigned.ipa
          draft: false
          prerelease: false
