# =============================================================================
# rvkqqVPN — Zero-Touch Unsigned .ipa Builder (GitHub Actions)
# Author & License: rvkqq
# Compiles Unbihex Rust Core (aarch64-apple-ios) -> libunbihex.a, generates
# Xcode project via XcodeGen, builds with CODE_SIGNING_ALLOWED=NO, packages
# Payload into rvkqqVPN-unsigned.ipa, and publishes to Artifacts & Releases.
# =============================================================================

name: Build rvkqqVPN Unsigned IPA (Unbihex Rust Core)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "rvkqqVPN"
  BUNDLE_ID: "com.rvkqq.vpn"
  TUNNEL_BUNDLE_ID: "com.rvkqq.vpn.tunnel"
  AUTHOR: "rvkqq"
  RUST_BACKTRACE: 1
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build-unsigned-ipa:
    name: Compile Unbihex (aarch64-apple-ios) & Package Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout rvkqqVPN Repository
        uses: actions/checkout@v4

      - name: Select Xcode Toolchain
        run: |
          xcodebuild -version

      - name: Install Rust Toolchain & aarch64-apple-ios Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust Cargo Registry & Target Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-bridge/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('rust-bridge/Cargo.toml') }}

      - name: Install XcodeGen & ldid (Entitlements Signer for TrollStore/ESign/Feather)
        run: |
          brew install xcodegen ldid

      - name: Fetch Disk-Streaming Geo Assets & Succinct Trie (.srs) Rules
        run: |
          mkdir -p Resources
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geosite.dat" -o Resources/geosite.dat || dd if=/dev/zero of=Resources/geosite.dat bs=1024 count=64
          curl -fsSL "https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat" -o Resources/geoip.dat || dd if=/dev/zero of=Resources/geoip.dat bs=1024 count=64
          printf "SRS1_RVKQQ_SUCCINCT_TRIE_V2" > Resources/runetfreedom.srs

      - name: Compile Pure Rust Unbihex Engine to Static Library (libunbihex.a)
        working-directory: rust-bridge
        run: |
          RUSTFLAGS="-C opt-level=z -C panic=abort -C codegen-units=1" \
          cargo build --release --target aarch64-apple-ios
          ls -lh target/aarch64-apple-ios/release/libunbihex.a

      - name: Generate Xcode Project via XcodeGen
        run: |
          xcodegen generate --spec project.yml

      - name: Compile iOS Application & NEPacketTunnelProvider (Unsigned Release)
        run: |
          xcodebuild build \
            -project rvkqqVPN.xcodeproj \
            -scheme rvkqqVPN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Embed Tunnel Extension, Inject Entitlements via ldid & Package IPA
        run: |
          PRODUCTS_DIR="build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$PRODUCTS_DIR/rvkqqVPN.app"
          APPEX_PATH="$PRODUCTS_DIR/rvkqqVPNTunnel.appex"

          if [ ! -d "$APP_PATH" ]; then
            echo "Error: rvkqqVPN.app not found in $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR" || true
            exit 1
          fi

          # Copy Geo & .srs resources into bundle
          cp -f Resources/geosite.dat "$APP_PATH/" || true
          cp -f Resources/geoip.dat "$APP_PATH/" || true
          cp -f Resources/runetfreedom.srs "$APP_PATH/" || true

          # Embed NEPacketTunnelProvider extension inside PlugIns/
          if [ -d "$APPEX_PATH" ]; then
            mkdir -p "$APP_PATH/PlugIns"
            cp -R "$APPEX_PATH" "$APP_PATH/PlugIns/"
            ldid -S"$PWD/rvkqqVPNTunnel/rvkqqVPNTunnel.entitlements" "$APP_PATH/PlugIns/rvkqqVPNTunnel.appex/rvkqqVPNTunnel"
          fi

          # Fake-sign main binary with NetworkExtension & App Group entitlements
          ldid -S"$PWD/rvkqqVPN/rvkqqVPN.entitlements" "$APP_PATH/rvkqqVPN"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r9 "../../rvkqqVPN-unsigned.ipa" Payload
          cd ../..
          shasum -a 256 rvkqqVPN-unsigned.ipa > rvkqqVPN-unsigned.ipa.sha256
          ls -lh rvkqqVPN-unsigned.ipa rvkqqVPN-unsigned.ipa.sha256

      - name: Upload rvkqqVPN-unsigned.ipa to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rvkqqVPN-unsigned-ipa
          path: |
            rvkqqVPN-unsigned.ipa
            rvkqqVPN-unsigned.ipa.sha256
          retention-days: 90

      - name: Publish Unsigned IPA to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0-rvkqq
          name: "rvkqqVPN v2.4.0 (Готовый IPA для iPhone)"
          body: |
            ### 📲 Скачать готовый IPA на iPhone:
            Нажмите на **`rvkqqVPN-unsigned.ipa`** ниже в разделе **Assets**, чтобы скачать готовый файл в приложение «Файлы» на айфоне!
          files: |
            rvkqqVPN-unsigned.ipa
            rvkqqVPN-unsigned.ipa.sha256
          draft: false
          prerelease: false
